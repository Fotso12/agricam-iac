# .github/workflows/main_pipeline.yml
name: Pipeline AgriCam - CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  TF_VERSION: '1.7.5'
  WORKING_DIR: 'environnements/prod'
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  # --- JOB 1 : INSTALLATION ET VALIDATION ---
  installation_et_validation:
    name: 🛠️ Installation & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Vérification du format (Style)
        run: terraform fmt -check -recursive
        working-directory: ${{ env.WORKING_DIR }}

      - name: Initialisation (Validation uniquement)
        run: terraform init -backend=false
        working-directory: ${{ env.WORKING_DIR }}

      - name: Validation de la configuration
        run: terraform validate
        working-directory: ${{ env.WORKING_DIR }}

  # --- JOB 2 : SCAN DE SÉCURITÉ ---
  securite_et_lint:
    name: 🛡️ Scan Sécurité (Checkov & TFLint)
    runs-on: ubuntu-latest
    needs: installation_et_validation # Ne se lance que si la validation syntaxique passe
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Scan Checkov (Sécurité Cloud)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          soft_fail: false # Bloque le pipeline en cas d'erreur critique

      - name: TFLint (Meilleures pratiques)
        uses: terraform-linters/setup-tflint@v4
      - run: tflint --init && tflint --recursive
        working-directory: ${{ env.WORKING_DIR }}

  # --- JOB 3 : PLANIFICATION (CONFIGURATION) ---
  configuration_plan:
    name: 📝 Planification de l'Infrastructure
    runs-on: ubuntu-latest
    needs: securite_et_lint
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      plan_exit_code: ${{ steps.plan.outputs.exitcode }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init (Complet)
        run: terraform init
        working-directory: ${{ env.WORKING_DIR }}

      - name: Génération du Plan
        id: plan
        run: |
          terraform plan \
            -var="db_password=${{ secrets.TF_VAR_DB_PASSWORD }}" \
            -out=tfplan \
            -detailed-exitcode
        working-directory: ${{ env.WORKING_DIR }}
        continue-on-error: true # On continue pour pouvoir capturer l'exitcode

      - name: Upload de l'artefact Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.WORKING_DIR }}/tfplan

  # --- JOB 4 : DÉPLOIEMENT ---
  deploiement:
    name: 🚀 Déploiement Production
    runs-on: ubuntu-latest
    needs: configuration_plan
    # Ne se lance que sur le main, si des changements sont détectés (exitcode 2)
    if: github.ref == 'refs/heads/main' && needs.configuration_plan.outputs.plan_exit_code == '2'
    environment: production
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Installation Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Récupération du Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.WORKING_DIR }}

      - name: Terraform Apply
        run: |
          terraform init
          terraform apply -auto-approve tfplan
        working-directory: ${{ env.WORKING_DIR }}