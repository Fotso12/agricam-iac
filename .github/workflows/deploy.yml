name: Plan et Deploiement Terraform

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  TF_VERSION: '1.7.5'
  WORKING_DIR: 'environnements/prod'
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment: production
    outputs:
      planExitCode: ${{ steps.plan.outputs.exitcode }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration des credentials AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Installation Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # Désactiver le wrapper peut aider à résoudre les problèmes de lecture de fichiers plans
          terraform_wrapper: false 

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="db_password=${{ secrets.TF_VAR_DB_PASSWORD }}" \
            -out=tfplan \
            -detailed-exitcode
        working-directory: ${{ env.WORKING_DIR }}
        continue-on-error: true

      - name: Sauvegarde du plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          # On s'assure de pointer vers le fichier dans le bon répertoire
          path: ${{ env.WORKING_DIR }}/tfplan
          retention-days: 1

      - name: Affichage du plan
        # Correction : on vérifie si le fichier existe avant de tenter le show
        run: |
          if [ -f tfplan ]; then
            terraform show tfplan
          else
            echo "Le fichier tfplan n'a pas été généré (peut-être aucune modification)."
          fi
        working-directory: ${{ env.WORKING_DIR }}

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    # Le code 2 signifie "Plan réussi avec des changements"
    if: github.ref == 'refs/heads/main' && needs.terraform-plan.outputs.planExitCode == '2'
    environment:
      name: production

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration des credentials AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Installation Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.WORKING_DIR }}

      - name: Recuperation du plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          # On télécharge directement dans le dossier de travail
          path: ${{ env.WORKING_DIR }}

      - name: Terraform Apply
        # On utilise le fichier tfplan qui est maintenant dans le working-directory
        run: terraform apply -auto-approve tfplan
        working-directory: ${{ env.WORKING_DIR }}

      - name: Affichage des outputs
        run: terraform output
        working-directory: ${{ env.WORKING_DIR }}