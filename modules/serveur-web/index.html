<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michel Darryl | Fullstack Portfolio</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c;
            --card: #141417;
            --accent: #00ff88;
            --text: #ffffff;
            --text-dim: #a1a1aa;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.05) 1px, transparent 0);
            background-size: 40px 40px;
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .portfolio-card {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 32px;
            padding: 3.5rem 2rem;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
        }

        .avatar-placeholder {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, var(--accent), #00a3ff);
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--bg);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
            position: relative;
        }

        .avatar-placeholder::after {
            content: '';
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 2px solid var(--accent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        h1 {
            font-size: 2.2rem;
            margin: 0.5rem 0;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .title {
            color: var(--accent);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 1.5rem;
        }

        p {
            color: var(--text-dim);
            line-height: 1.7;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 2.5rem;
        }

        .skill-tag {
            background: rgba(255,255,255,0.04);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 0.8rem;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 25px;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 2rem;
        }

        .social-links a {
            color: var(--text-dim);
            transition: all 0.3s ease;
        }

        .social-links a:hover {
            color: var(--accent);
            transform: translateY(-3px);
        }

        .badge-live {
            display: inline-flex;
            align-items: center;
            background: rgba(0, 255, 136, 0.1);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 0.7rem;
            margin-top: 2rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="portfolio-card">
        <div class="avatar-placeholder">MF</div>
        
        <h1>Michel Darryl</h1>
        <div class="title">Fullstack Developer</div>
        
        <p>
            Spécialiste en architecture logicielle (CSI & EADL). Passionné par le Cloud, l'Automatisation et la création d'expériences numériques performantes.
        </p>

        <div class="skills">
            <span class="skill-tag">Angular</span>
            <span class="skill-tag">Spring Boot</span>
            <span class="skill-tag">Terraform</span>
            <span class="skill-tag">AWS</span>
            <span class="skill-tag">Docker</span>
        </div>

        <div class="social-links">
            <a href="#"><i data-lucide="github"></i></a>
            <a href="#"><i data-lucide="linkedin"></i></a>
            <a href="#"><i data-lucide="mail"></i></a>
        </div>

        <div class="badge-live">
            <i data-lucide="zap" style="width:12px; margin-right:5px;"></i> LIVE ON AWS EC2
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
