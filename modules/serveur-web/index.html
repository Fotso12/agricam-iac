<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michel Darryl | Fullstack Dev Portfolio</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c;
            --card: #141417;
            --accent: #00ff88;
            --text: #ffffff;
            --text-dim: #a1a1aa;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.05) 1px, transparent 0);
            background-size: 40px 40px;
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .portfolio-card {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 32px;
            padding: 3.5rem 2rem;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
            transition: transform 0.3s ease;
        }

        .portfolio-card:hover {
            transform: translateY(-5px);
        }

        .profile-container {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 1.5rem;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
            z-index: 2;
            position: relative;
        }

        .profile-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--accent);
            border-radius: 50%;
            filter: blur(25px);
            opacity: 0.2;
            z-index: 1;
        }

        h1 {
            font-size: 2.4rem;
            margin: 0.5rem 0;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .title {
            color: var(--accent);
            font-weight: 600;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 1.5rem;
        }

        p {
            color: var(--text-dim);
            line-height: 1.7;
            margin-bottom: 2rem;
            font-size: 1.05rem;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 2.5rem;
        }

        .skill-tag {
            background: rgba(255,255,255,0.04);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.2s ease;
        }

        .skill-tag:hover {
            background: rgba(0, 255, 136, 0.1);
            border-color: var(--accent);
            color: var(--accent);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 25px;
            border-top: 1px solid rgba(255,255,255,0.08);
            padding-top: 2rem;
        }

        .social-links a {
            color: var(--text-dim);
            transition: all 0.3s ease;
        }

        .social-links a:hover {
            color: var(--accent);
            transform: scale(1.2);
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 10px var(--accent);
        }
    </style>
</head>
<body>

    <div class="portfolio-card">
        <div class="profile-container">
            <img src="darryl.jpg" alt="Michel Darryl" class="profile-img">
        </div>
        
        <h1>Michel Darryl</h1>
        <div class="title">Fullstack Developer</div>
        
        <p>
            Expert en architecture logicielle spécialisé dans la conception de systèmes d'information scalables. Je transforme des idées complexes en infrastructures robustes.
        </p>

        <div class="skills">
            <span class="skill-tag">Angular</span>
            <span class="skill-tag">Spring Boot</span>
            <span class="skill-tag">Terraform</span>
            <span class="skill-tag">AWS</span>
            <span class="skill-tag">Docker</span>
        </div>

        <div class="social-links">
            <a href="#"><i data-lucide="github"></i></a>
            <a href="#"><i data-lucide="linkedin"></i></a>
            <a href="#"><i data-lucide="mail"></i></a>
        </div>

        <div style="margin-top: 2rem; font-size: 0.75rem; color: #444;">
            <span class="status-dot"></span> Infrastructure live sur AWS EC2
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
